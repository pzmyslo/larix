<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

#box {
    padding:15px;
}

h3 {
    color:#ff1744;
}

pre {
    white-space:pre-wrap;
    word-break:break-word;
    font-size:12px;
}
</style>
</head>

<body>

<div id="box">

<h3>TRACCAR API TEST</h3>

<div id="status">
Łączenie...
</div>

<pre id="result"></pre>

</div>

<script>

const params =
    new URLSearchParams(
        location.search
    );

const token =
    params.get("token");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");


async function test() {

    if (!token) {

        status.textContent =
            "BRAK TOKENU W URL";

        return;

    }


    const url =
        "https://demo.traccar.org/api/session?token="
        + encodeURIComponent(token);


    try {

        const response =
            await fetch(url, {
                method:"GET",
                credentials:"include",
                headers:{
                    "Accept":
                        "application/json"
                }
            });


        status.textContent =
            "HTTP: " +
            response.status;


        const text =
            await response.text();


        result.textContent =
            text;


    }
    catch(error) {

        status.textContent =
            "BŁĄD FETCH";

        result.textContent =
            error.toString();

    }

}

test();

</script>

</body>
</html>
