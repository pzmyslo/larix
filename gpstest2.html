<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body {
    margin:0;
    width:100%;
    min-height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

#box {
    padding:15px;
}

h3 {
    color:#ff1744;
}

pre {
    white-space:pre-wrap;
    word-break:break-word;
    font-size:12px;
}
</style>
</head>

<body>

<div id="box">

<h3>TRACCAR POSITION TEST</h3>

<div id="status">
Łączenie...
</div>

<pre id="result"></pre>

</div>

<script>

const params =
    new URLSearchParams(
        location.search
    );

const token =
    params.get("token");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");


async function test() {

    if (!token) {

        status.textContent =
            "BRAK TOKENU";

        return;

    }

    try {

        /*
         * Najpierw tworzymy sesję.
         */

        const sessionResponse =
            await fetch(
                "https://demo.traccar.org/api/session?token="
                + encodeURIComponent(token),

                {
                    method: "GET",
                    credentials: "include"
                }
            );


        if (!sessionResponse.ok) {

            status.textContent =
                "SESJA HTTP: "
                + sessionResponse.status;

            return;

        }


        const session =
            await sessionResponse.json();


        /*
         * Następnie pobieramy pozycję.
         */

        const positionResponse =
            await fetch(
                "https://demo.traccar.org/api/positions",

                {
                    method: "GET",
                    credentials: "include",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        status.textContent =
            "POZYCJE HTTP: "
            + positionResponse.status;


        const text =
            await positionResponse.text();


        result.textContent =
            text;


        /*
         * Jeżeli odpowiedź jest JSON-em,
         * pokazujemy najważniejsze dane.
         */

        try {

            const positions =
                JSON.parse(text);


            if (
                Array.isArray(positions) &&
                positions.length > 0
            ) {

                const p =
                    positions[0];


                result.textContent +=
                    "\n\n-------------------------\n"
                    +
                    "LAT: "
                    + p.latitude
                    + "\n"
                    +
                    "LON: "
                    + p.longitude
                    + "\n"
                    +
                    "SPEED: "
                    + p.speed
                    + "\n"
                    +
                    "COURSE: "
                    + p.course
                    + "\n"
                    +
                    "ALTITUDE: "
                    + p.altitude
                    + "\n"
                    +
                    "DEVICE ID: "
                    + p.deviceId;

            }

        }
        catch(e) {

            /*
             * Odpowiedź nie była JSON-em.
             */

        }

    }
    catch(error) {

        status.textContent =
            "BŁĄD FETCH";

        result.textContent =
            error.toString();

    }

}

test();

</script>

</body>
</html>
