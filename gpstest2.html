<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>GPS Web Test</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: rgba(0,0,0,0.88);

    color: white;

    font-family: Arial, sans-serif;
}

#box {
    box-sizing: border-box;

    width: 100%;
    height: 100%;

    padding: 14px;
}

#title {
    color: #ff1744;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 12px;
}

.row {
    margin-bottom: 9px;

    font-size: 14px;
}

.label {
    color: #aaa;

    font-size: 11px;

    text-transform: uppercase;
}

.value {
    color: #fff;

    font-size: 15px;

    font-weight: bold;

    word-break: break-word;
}

#status {
    margin-top: 12px;

    padding: 8px;

    border-radius: 6px;

    background: #333;

    color: #ffd740;

    font-size: 13px;
}

.ok {
    background: #064d27 !important;
    color: #69f0ae !important;
}

.error {
    background: #5b1010 !important;
    color: #ff8a80 !important;
}

</style>
</head>

<body>

<div id="box">

    <div id="title">
        ● GPS WEB TEST
    </div>

    <div class="row">
        <div class="label">Status</div>
        <div
            class="value"
            id="statusText">
            Sprawdzanie GPS...
        </div>
    </div>

    <div class="row">
        <div class="label">Szerokość</div>
        <div
            class="value"
            id="latitude">
            --
        </div>
    </div>

    <div class="row">
        <div class="label">Długość</div>
        <div
            class="value"
            id="longitude">
            --
        </div>
    </div>

    <div class="row">
        <div class="label">Dokładność</div>
        <div
            class="value"
            id="accuracy">
            --
        </div>
    </div>

    <div class="row">
        <div class="label">Wysokość</div>
        <div
            class="value"
            id="altitude">
            --
        </div>
    </div>

    <div class="row">
        <div class="label">Prędkość</div>
        <div
            class="value"
            id="speed">
            --
        </div>
    </div>

    <div class="row">
        <div class="label">Kierunek</div>
        <div
            class="value"
            id="heading">
            --
        </div>
    </div>

    <div id="status">
        Oczekiwanie na lokalizację...
    </div>

</div>


<script>

/* ==========================================================
   ELEMENTY
   ========================================================== */

const statusText =
    document.getElementById(
        "statusText"
    );

const statusBox =
    document.getElementById(
        "status"
    );

const latitude =
    document.getElementById(
        "latitude"
    );

const longitude =
    document.getElementById(
        "longitude"
    );

const accuracy =
    document.getElementById(
        "accuracy"
    );

const altitude =
    document.getElementById(
        "altitude"
    );

const speed =
    document.getElementById(
        "speed"
    );

const heading =
    document.getElementById(
        "heading"
    );


/* ==========================================================
   STATUS
   ========================================================== */

function setStatus(
    text,
    type
) {

    statusText.textContent =
        text;

    statusBox.textContent =
        text;

    statusBox.className =
        "";

    if (type === "ok") {

        statusBox.classList.add(
            "ok"
        );

    }

    if (type === "error") {

        statusBox.classList.add(
            "error"
        );

    }

}


/* ==========================================================
   BŁĘDY GPS
   ========================================================== */

function gpsError(error) {

    let message =
        "Nieznany błąd GPS.";

    switch (
        error.code
    ) {

        case 1:

            message =
                "BRAK ZGODY NA LOKALIZACJĘ.";

            break;

        case 2:

            message =
                "LOKALIZACJA NIEDOSTĘPNA.";

            break;

        case 3:

            message =
                "PRZEKROCZONO CZAS OCZEKIWANIA.";

            break;

    }

    setStatus(
        message,
        "error"
    );

}


/* ==========================================================
   OTRZYMANIE GPS
   ========================================================== */

function gpsSuccess(
    position
) {

    const coords =
        position.coords;


    /* Szerokość */

    latitude.textContent =
        coords.latitude
            .toFixed(6);


    /* Długość */

    longitude.textContent =
        coords.longitude
            .toFixed(6);


    /* Dokładność */

    if (
        coords.accuracy !== null
    ) {

        accuracy.textContent =
            Math.round(
                coords.accuracy
            ) + " m";

    }


    /* Wysokość */

    if (
        coords.altitude !== null
    ) {

        altitude.textContent =
            coords.altitude
                .toFixed(1)
            + " m";

    } else {

        altitude.textContent =
            "brak danych";

    }


    /* Prędkość */

    if (
        coords.speed !== null &&
        coords.speed >= 0
    ) {

        speed.textContent =
            (
                coords.speed * 3.6
            ).toFixed(1)
            + " km/h";

    } else {

        speed.textContent =
            "brak danych";

    }


    /* Kierunek */

    if (
        coords.heading !== null &&
        !isNaN(coords.heading)
    ) {

        heading.textContent =
            Math.round(
                coords.heading
            )
            + "°";

    } else {

        heading.textContent =
            "brak danych";

    }


    /* Sukces */

    setStatus(
        "GPS DZIAŁA — lokalizacja została odebrana.",
        "ok"
    );

}


/* ==========================================================
   SPRAWDZENIE OBSŁUGI GEOLOCATION
   ========================================================== */

if (
    !("geolocation" in navigator)
) {

    setStatus(
        "TEN WEB WIDGET NIE OBSŁUGUJE GEOLOCATION.",
        "error"
    );

} else {

    setStatus(
        "Geolocation dostępne. Pobieranie GPS...",
        null
    );


    /* ======================================================
       WATCH POSITION

       Ważne:
       używamy watchPosition(), a nie getCurrentPosition(),
       ponieważ chcemy później przesuwać mapę na żywo.
       ====================================================== */

    navigator.geolocation.watchPosition(

        gpsSuccess,

        gpsError,

        {

            enableHighAccuracy:
                true,

            maximumAge:
                1000,

            timeout:
                15000

        }

    );

}

</script>

</body>
</html>
