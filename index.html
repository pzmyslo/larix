<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<!-- Leaflet - mapa OpenStreetMap -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

/* Główne okno */
#gpsBox {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
    background: #111;

    color: white;
}

/* MAPA */
#map {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 1;
}

/*
 * Małe przyciemnienie mapy.
 * Dzięki temu mapa jest czytelna na transmisji.
 */
#mapShade {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.00) 35%,
            rgba(0,0,0,0.12)
        );

    z-index: 400;
}

/* Górny pasek */
#topBar {
    position: absolute;

    left: 8px;
    right: 8px;
    top: 8px;

    min-height: 34px;

    padding: 6px 10px;

    box-sizing: border-box;

    border-radius: 9px;

    background: rgba(0,0,0,0.78);

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 13px;
}

/* LIVE */
#live {
    color: #ff5252;
    font-weight: bold;
    white-space: nowrap;
}

/* Lokalizacja */
#place {
    margin-left: 10px;

    color: #eee;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    text-align: right;
}

/* Dolny panel */
#data {
    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 8px;

    padding: 8px;

    box-sizing: border-box;

    border-radius: 9px;

    background: rgba(0,0,0,0.80);

    z-index: 500;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 5px 12px;

    font-size: 11px;
}

/* Pojedyncza wartość */
.dataItem {
    min-width: 0;
}

.label {
    color: #aaa;
    font-size: 9px;
    text-transform: uppercase;
}

.value {
    color: white;
    font-size: 12px;
    font-weight: bold;

    white-space: nowrap;
}

/* Marker */
.gpsMarker {
    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: #ff1744;

    border: 4px solid white;

    box-sizing: border-box;

    box-shadow:
        0 0 0 2px rgba(255,23,68,0.45),
        0 2px 8px rgba(0,0,0,0.65);
}

/* Kierunek */
.directionArrow {
    width: 0;
    height: 0;

    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 25px solid #ff1744;

    filter:
        drop-shadow(0 2px 2px rgba(0,0,0,0.7));

    transform-origin: 8px 25px;
}

/* Leaflet */
.leaflet-control-attribution {
    font-size: 7px !important;
    background: rgba(255,255,255,0.65) !important;
}

.leaflet-control-zoom {
    display: none;
}
</style>
</head>

<body>

<div id="gpsBox">

    <!-- MAPA -->
    <div id="map"></div>

    <div id="mapShade"></div>

    <!-- GÓRNY PANEL -->
    <div id="topBar">

        <div id="live">
            ● LIVE GPS
        </div>

        <div id="place">
            <% gps_place(locality, pl_PL) %>
        </div>

    </div>

    <!-- DANE GPS -->
    <div id="data">

        <div class="dataItem">
            <div class="label">Pozycja</div>
            <div class="value">
                <% gps_coord(dd, 6) %>
            </div>
        </div>

        <div class="dataItem">
            <div class="label">Prędkość</div>
            <div class="value">
                <% gps_speed(km/h) %>
            </div>
        </div>

        <div class="dataItem">
            <div class="label">Wysokość</div>
            <div class="value">
                <% gps_alt(m) %> m
            </div>
        </div>

        <div class="dataItem">
            <div class="label">Kierunek</div>
            <div class="value">
                <% gps_heading(tru, "d0° r16") %>
            </div>
        </div>

    </div>

</div>

<script>

/* ============================================================
   ODCZYT WSPÓŁRZĘDNYCH Z LARIX
   ============================================================ */

const larixCoordinates =
    `<% gps_coord(dd, 6) %>`;


/*
 * Larix zwraca współrzędne w postaci podobnej do:
 *
 * 52.123456 N, 21.123456 E
 *
 * lub:
 *
 * 52.123456 N 21.123456 E
 *
 * Funkcja poniżej obsługuje oba przypadki.
 */

function parseCoordinates(text) {

    if (!text) {
        return null;
    }

    const matches = text.match(
        /(-?\d+(?:\.\d+)?)\s*([NS])[\s,;]+(-?\d+(?:\.\d+)?)\s*([EW])/i
    );

    if (!matches) {
        return null;
    }

    let lat = parseFloat(matches[1]);
    let lon = parseFloat(matches[3]);

    const latDirection = matches[2].toUpperCase();
    const lonDirection = matches[4].toUpperCase();

    if (latDirection === "S") {
        lat = -Math.abs(lat);
    }

    if (lonDirection === "W") {
        lon = -Math.abs(lon);
    }

    return {
        lat: lat,
        lon: lon
    };
}


/* ============================================================
   GPS
   ============================================================ */

const gps = parseCoordinates(larixCoordinates);


/* ============================================================
   MAPA
   ============================================================ */

let map;

let gpsMarker;
let directionMarker;

let routeLine;


/*
 * Jeżeli GPS jest dostępny,
 * rozpoczynamy mapę od aktualnej pozycji.
 *
 * Jeżeli nie ma GPS, pokazujemy domyślnie środek Europy.
 */

const startLat =
    gps ? gps.lat : 52.2297;

const startLon =
    gps ? gps.lon : 21.0122;


map = L.map("map", {
    zoomControl: false,

    attributionControl: true,

    center: [
        startLat,
        startLon
    ],

    zoom: gps ? 16 : 5,

    dragging: false,

    scrollWheelZoom: false,

    doubleClickZoom: false,

    boxZoom: false,

    keyboard: false,

    touchZoom: false
});


/* ============================================================
   OPENSTREETMAP
   ============================================================ */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors',

        crossOrigin: true
    }
).addTo(map);


/* ============================================================
   MARKER GPS
   ============================================================ */

const markerIcon =
    L.divIcon({

        className: "",

        html:
            '<div class="gpsMarker"></div>',

        iconSize: [
            22,
            22
        ],

        iconAnchor: [
            11,
            11
        ]

    });


/* ============================================================
   MARKER KIERUNKU
   ============================================================ */

const arrowIcon =
    L.divIcon({

        className: "",

        html:
            '<div id="directionArrow" class="directionArrow"></div>',

        iconSize: [
            16,
            25
        ],

        iconAnchor: [
            8,
            12
        ]

    });


/* ============================================================
   PAMIĘĆ TRASY
   ============================================================ */

let routePoints = [];


/*
 * localStorage pozwala zachować ślad pomiędzy
 * odświeżeniami Web Widgetu.
 */

try {

    const saved =
        localStorage.getItem(
            "larix_gps_route"
        );

    if (saved) {

        routePoints =
            JSON.parse(saved);

    }

} catch (e) {

    routePoints = [];

}


/* ============================================================
   OGRANICZENIE DŁUGOŚCI ŚLADU
   ============================================================ */

const MAX_ROUTE_POINTS = 1000;


/* ============================================================
   DODANIE AKTUALNEJ POZYCJI
   ============================================================ */

if (gps) {

    const currentPoint = [
        gps.lat,
        gps.lon
    ];

    /*
     * Dodajemy punkt tylko wtedy,
     * gdy rzeczywiście przesunęliśmy się.
     */

    let addPoint = true;

    if (routePoints.length > 0) {

        const last =
            routePoints[
                routePoints.length - 1
            ];

        const distance =
            map.distance(
                last,
                currentPoint
            );

        /*
         * Minimalne przesunięcie 2 m.
         */

        if (distance < 2) {
            addPoint = false;
        }

    }


    if (addPoint) {

        routePoints.push(
            currentPoint
        );

    }


    /*
     * Nie przechowujemy nieskończonej trasy.
     */

    if (
        routePoints.length >
        MAX_ROUTE_POINTS
    ) {

        routePoints =
            routePoints.slice(
                -MAX_ROUTE_POINTS
            );

    }


    try {

        localStorage.setItem(
            "larix_gps_route",
            JSON.stringify(
                routePoints
            )
        );

    } catch (e) {
        /* brak localStorage - ignorujemy */
    }


    /* ========================================================
       ŚLAD TRASY
       ======================================================== */

    if (routePoints.length > 1) {

        routeLine =
            L.polyline(
                routePoints,
                {
                    color: "#ff1744",

                    weight: 5,

                    opacity: 0.9,

                    lineCap: "round",

                    lineJoin: "round"
                }
            ).addTo(map);

    }


    /* ========================================================
       AKTUALNY PUNKT
       ======================================================== */

    gpsMarker =
        L.marker(
            currentPoint,
            {
                icon: markerIcon,

                interactive: false
            }
        ).addTo(map);


    /* ========================================================
       AUTOMATYCZNE CENTROWANIE
       ======================================================== */

    map.setView(
        currentPoint,
        16,
        {
            animate: false
        }
    );


    /* ========================================================
       KIERUNEK
       ======================================================== */

    const headingText =
        `<% gps_heading(tru, "d0") %>`;


    const headingMatch =
        headingText.match(
            /(-?\d+(?:\.\d+)?)/
        );


    if (headingMatch) {

        const heading =
            parseFloat(
                headingMatch[1]
            );


        directionMarker =
            L.marker(
                currentPoint,
                {
                    icon: arrowIcon,

                    interactive: false
                }
            ).addTo(map);


        /*
         * Obracamy strzałkę zgodnie
         * z kierunkiem GPS.
         */

        setTimeout(
            function() {

                const arrow =
                    document.getElementById(
                        "directionArrow"
                    );

                if (arrow) {

                    arrow.style.transform =
                        "rotate(" +
                        heading +
                        "deg)";

                }

            },
            50
        );

    }

}


/* ============================================================
   KONTROLA ROZMIARU MAPY
   ============================================================ */

setTimeout(
    function() {

        map.invalidateSize();

    },
    300
);

</script>

</body>
</html>
