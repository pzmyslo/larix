<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>Larix GPS Map</title>

<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

/* =========================================================
   MAPA
   ========================================================= */

#map {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #d8e0d4;

    z-index: 1;
}


/* =========================================================
   DELIKATNE PRZYCIEMNIENIE MAPY
   ========================================================= */

#shade {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.30),
            rgba(0,0,0,0.00) 45%,
            rgba(0,0,0,0.20)
        );

    z-index: 400;
}


/* =========================================================
   GÓRNY PANEL
   ========================================================= */

#topPanel {

    position: absolute;

    left: 8px;
    right: 8px;
    top: 8px;

    min-height: 32px;

    padding: 6px 9px;

    box-sizing: border-box;

    border-radius: 8px;

    background:
        rgba(0,0,0,0.78);

    color: white;

    z-index: 500;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 8px;

    font-size: 12px;
}


/* =========================================================
   LIVE
   ========================================================= */

#live {

    color: #ff1744;

    font-weight: bold;

    white-space: nowrap;

}


/* =========================================================
   MIEJSCOWOŚĆ
   ========================================================= */

#place {

    color: #ffffff;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    text-align: right;

}


/* =========================================================
   DOLNY PANEL
   ========================================================= */

#info {

    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 8px;

    padding: 8px;

    box-sizing: border-box;

    border-radius: 8px;

    background:
        rgba(0,0,0,0.82);

    color: white;

    z-index: 500;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 5px 10px;

}


/* =========================================================
   ELEMENT DANYCH
   ========================================================= */

.item {

    min-width: 0;

}


.label {

    color: #aaa;

    font-size: 8px;

    text-transform: uppercase;

    letter-spacing: 0.4px;

}


.value {

    color: #fff;

    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================================
   MARKER GPS
   ========================================================= */

.gpsDot {

    width: 20px;
    height: 20px;

    box-sizing: border-box;

    border-radius: 50%;

    background: #ff1744;

    border: 4px solid white;

    box-shadow:
        0 0 0 3px
        rgba(255,23,68,0.35),

        0 2px 7px
        rgba(0,0,0,0.65);

}


/* =========================================================
   STRZAŁKA KIERUNKU
   ========================================================= */

.arrow {

    width: 0;
    height: 0;

    border-left:
        8px solid transparent;

    border-right:
        8px solid transparent;

    border-bottom:
        26px solid #ff1744;

    filter:
        drop-shadow(
            0 2px 2px
            rgba(0,0,0,0.7)
        );

}


/* =========================================================
   LEAFLET
   ========================================================= */

.leaflet-control-zoom {

    display: none;

}


.leaflet-control-attribution {

    font-size: 7px !important;

    background:
        rgba(255,255,255,0.65)
        !important;

}


/* =========================================================
   STATUS GPS
   ========================================================= */

#gpsStatus {

    position: absolute;

    left: 8px;
    bottom: 8px;

    z-index: 600;

    display: none;

    padding: 3px 6px;

    border-radius: 5px;

    background:
        rgba(200,0,0,0.85);

    color: white;

    font-size: 9px;

}

</style>
</head>


<body>


<!-- =======================================================
     DANE DOSTARCZANE PRZEZ LARIX
     ======================================================= -->

<div id="larixData" style="display:none">

    <span id="coord">
        <% gps_coord(dd, 6) %>
    </span>

    <span id="speed">
        <% gps_speed(km/h) %>
    </span>

    <span id="altitude">
        <% gps_alt(m) %>
    </span>

    <span id="heading">
        <% gps_heading(tru, "d0") %>
    </span>

    <span id="place">
        <% gps_place(locality, pl_PL) %>
    </span>

</div>


<!-- =======================================================
     MAPA
     ======================================================= -->

<div id="map"></div>

<div id="shade"></div>


<!-- =======================================================
     GÓRNY PANEL
     ======================================================= -->

<div id="topPanel">

    <div id="live">
        ● LIVE GPS
    </div>

    <div id="location">
        <span id="locationText"></span>
    </div>

</div>


<!-- =======================================================
     INFORMACJE GPS
     ======================================================= -->

<div id="info">

    <div class="item">

        <div class="label">
            Pozycja
        </div>

        <div
            class="value"
            id="coordText">
            --
        </div>

    </div>


    <div class="item">

        <div class="label">
            Prędkość
        </div>

        <div
            class="value"
            id="speedText">
            --
        </div>

    </div>


    <div class="item">

        <div class="label">
            Wysokość
        </div>

        <div
            class="value"
            id="altText">
            --
        </div>

    </div>


    <div class="item">

        <div class="label">
            Kierunek
        </div>

        <div
            class="value"
            id="headingText">
            --
        </div>

    </div>

</div>


<div id="gpsStatus">
    BRAK GPS
</div>


<script>

/* =========================================================
   POBRANIE DANYCH Z LARIX
   ========================================================= */

const coordRaw =
    document
        .getElementById("coord")
        .textContent
        .trim();

const speedRaw =
    document
        .getElementById("speed")
        .textContent
        .trim();

const altitudeRaw =
    document
        .getElementById("altitude")
        .textContent
        .trim();

const headingRaw =
    document
        .getElementById("heading")
        .textContent
        .trim();

const placeRaw =
    document
        .getElementById("place")
        .textContent
        .trim();


/* =========================================================
   WYŚWIETLANIE DANYCH
   ========================================================= */

document
    .getElementById("coordText")
    .textContent =
        coordRaw || "--";


document
    .getElementById("speedText")
    .textContent =
        speedRaw || "--";


document
    .getElementById("altText")
    .textContent =
        altitudeRaw
        ? altitudeRaw + " m"
        : "--";


document
    .getElementById("headingText")
    .textContent =
        headingRaw
        ? headingRaw + "°"
        : "--";


document
    .getElementById("locationText")
    .textContent =
        placeRaw || "";


/* =========================================================
   PARSOWANIE GPS

   Larix zwraca np.:

   52.123456 N, 21.123456 E

   ========================================================= */

function parseGPS(text) {

    if (!text) {
        return null;
    }


    const regex =
        /(-?\d+(?:\.\d+)?)\s*([NS])[\s,;]+(-?\d+(?:\.\d+)?)\s*([EW])/i;


    const match =
        text.match(regex);


    if (!match) {

        /*
         * Awaryjnie próbujemy znaleźć
         * dwie liczby dziesiętne.
         */

        const numbers =
            text.match(
                /-?\d+(?:\.\d+)/g
            );


        if (
            numbers &&
            numbers.length >= 2
        ) {

            const lat =
                parseFloat(numbers[0]);

            const lon =
                parseFloat(numbers[1]);


            if (
                Math.abs(lat) <= 90 &&
                Math.abs(lon) <= 180
            ) {

                return {
                    lat: lat,
                    lon: lon
                };

            }

        }


        return null;

    }


    let lat =
        parseFloat(match[1]);

    let lon =
        parseFloat(match[3]);


    const ns =
        match[2].toUpperCase();

    const ew =
        match[4].toUpperCase();


    if (ns === "S") {

        lat =
            -Math.abs(lat);

    }


    if (ew === "W") {

        lon =
            -Math.abs(lon);

    }


    return {

        lat: lat,

        lon: lon

    };

}


/* =========================================================
   GPS
   ========================================================= */

const gps =
    parseGPS(coordRaw);


/* =========================================================
   MAPA STARTOWA
   ========================================================= */

/*
 * Jeśli GPS nie jest dostępny,
 * pokazujemy Polskę/Europę.
 */

const startLat =
    gps
    ? gps.lat
    : 52.0;


const startLon =
    gps
    ? gps.lon
    : 19.0;


const startZoom =
    gps
    ? 16
    : 5;


/* =========================================================
   INICJALIZACJA LEAFLET
   ========================================================= */

const map =
    L.map(
        "map",
        {

            center:
                [
                    startLat,
                    startLon
                ],

            zoom:
                startZoom,

            zoomControl:
                false,

            attributionControl:
                true,

            dragging:
                false,

            scrollWheelZoom:
                false,

            doubleClickZoom:
                false,

            boxZoom:
                false,

            keyboard:
                false,

            touchZoom:
                false

        }
    );


/* =========================================================
   OPENSTREETMAP
   ========================================================= */

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors",

        crossOrigin:
            true

    }

).addTo(map);


/* =========================================================
   IKONA GPS
   ========================================================= */

const gpsIcon =
    L.divIcon(

        {

            className:
                "",

            html:
                '<div class="gpsDot"></div>',

            iconSize:
                [20,20],

            iconAnchor:
                [10,10]

        }

    );


/* =========================================================
   IKONA STRZAŁKI
   ========================================================= */

const arrowIcon =
    L.divIcon(

        {

            className:
                "",

            html:
                '<div id="arrowElement" class="arrow"></div>',

            iconSize:
                [16,26],

            iconAnchor:
                [8,13]

        }

    );


/* =========================================================
   TRASA
   ========================================================= */

/*
 * sessionStorage:
 *
 * - trasa pozostaje przy kolejnych
 *   odświeżeniach Web Widgetu,
 *
 * - ale znika po zakończeniu sesji.
 */

let route = [];


try {

    const saved =
        sessionStorage.getItem(
            "larix_route"
        );


    if (saved) {

        const parsed =
            JSON.parse(saved);


        if (
            Array.isArray(parsed)
        ) {

            route =
                parsed;

        }

    }

} catch (e) {

    route = [];

}


/* =========================================================
   DODANIE AKTUALNEGO PUNKTU
   ========================================================= */

if (gps) {

    const current =
        [
            gps.lat,
            gps.lon
        ];


    let shouldAdd =
        true;


    if (route.length > 0) {

        const last =
            route[
                route.length - 1
            ];


        /*
         * Odległość w przybliżeniu.
         * Nie dodajemy punktów oddalonych
         * od poprzedniego o mniej niż 2 metry.
         */

        const dLat =
            (current[0] - last[0])
            * 111320;


        const dLon =
            (current[1] - last[1])
            * 111320
            * Math.cos(
                current[0] *
                Math.PI / 180
            );


        const distance =
            Math.sqrt(
                dLat*dLat +
                dLon*dLon
            );


        if (distance < 2) {

            shouldAdd =
                false;

        }

    }


    if (shouldAdd) {

        route.push(
            current
        );

    }


    /*
     * Maksymalnie 1500 punktów.
     */

    if (
        route.length > 1500
    ) {

        route =
            route.slice(
                -1500
            );

    }


    try {

        sessionStorage.setItem(

            "larix_route",

            JSON.stringify(
                route
            )

        );

    } catch (e) {}

}


/* =========================================================
   RYSOWANIE ŚLADU
   ========================================================= */

if (
    route.length > 1
) {

    L.polyline(

        route,

        {

            color:
                "#ff1744",

            weight:
                4,

            opacity:
                0.90,

            lineCap:
                "round",

            lineJoin:
                "round"

        }

    ).addTo(map);

}


/* =========================================================
   AKTUALNA POZYCJA
   ========================================================= */

let marker =
    null;


let directionMarker =
    null;


if (gps) {

    const position =
        [
            gps.lat,
            gps.lon
        ];


    marker =
        L.marker(

            position,

            {

                icon:
                    gpsIcon,

                interactive:
                    false

            }

        ).addTo(map);


    /*
     * Mapa podąża za aktualną pozycją.
     */

    map.setView(

        position,

        16,

        {

            animate:
                false

        }

    );


    /* =====================================================
       KIERUNEK
       ===================================================== */

    const headingMatch =
        headingRaw.match(
            /-?\d+(?:\.\d+)*/
        );


    if (
        headingMatch
    ) {

        const heading =
            parseFloat(
                headingMatch[0]
            );


        if (
            !isNaN(heading)
        ) {

            directionMarker =
                L.marker(

                    position,

                    {

                        icon:
                            arrowIcon,

                        interactive:
                            false

                    }

                ).addTo(map);


            /*
             * Strzałka jest skierowana
             * według azymutu GPS.
             */

            setTimeout(

                function() {

                    const arrow =
                        document
                            .getElementById(
                                "arrowElement"
                            );


                    if (arrow) {

                        arrow.style.transform =
                            "rotate(" +
                            heading +
                            "deg)";

                    }

                },

                50

            );

        }

    }

}


/* =========================================================
   AKTUALIZACJA ROZMIARU MAPY
   ========================================================= */

setTimeout(

    function() {

        map.invalidateSize();

    },

    500

);

</script>

</body>
</html>
