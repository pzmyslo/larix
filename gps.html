<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.75);
    color: white;
    font-family: Arial;
}

#box {
    padding: 15px;
    font-size: 18px;
}

.red {
    color: #ff1744;
}
</style>
</head>

<body>

<div id="box">

    <div class="red">● GPS TEST</div>

    <br>

    POZYCJA:<br>
    <% gps_coord(dd, 6) %>

    <br><br>

    PRĘDKOŚĆ:<br>
    <% gps_speed(km/h) %>

    <br><br>

    WYSOKOŚĆ:<br>
    <% gps_alt(m) %> m

    <br><br>

    KIERUNEK:<br>
    <% gps_heading(tru, "d0") %>°

</div>

</body>
</html>
